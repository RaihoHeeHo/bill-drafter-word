<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The bill - Bill Drafter</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<link rel="stylesheet" href="src/taskpane.css">
<link rel="stylesheet" href="src/billwindow.css">
</head>
<body class="billwindow">
<header class="wbar">
  <div class="wtitle"><img src="assets/icon-32.png" alt="" width="18" height="18"> <b id="w-title">The bill</b> <span id="w-status" class="hint"></span></div>
  <input id="w-search" type="search" placeholder="Search the whole bill: words, codes, amounts…" autocomplete="off" aria-label="Search the whole bill">
</header>
<div class="wmain">
  <aside>
    <input id="w-filter" placeholder="Find a schedule" autocomplete="off" aria-label="Find a schedule">
    <ol id="w-list" class="wlist"></ol>
  </aside>
  <section id="w-view">
    <div id="w-results" hidden></div>
    <div id="w-head" class="whead" hidden><div><h1 id="w-name"></h1><span id="w-sub" class="hint"></span></div><div class="row"><button id="w-open" class="primary">Open in Word</button><button id="w-goto">Go to in Word</button></div></div>
    <div id="w-sched" class="wsched"><p class="hint">Loading the bill…</p></div>
  </section>
</div>
<div id="w-bar" class="wsel" hidden><span id="w-sel-what"></span><button id="w-sel-go" class="primary">Go to in Word</button></div>
<script src="src/lib/drafting.js"></script>
<script src="src/lib/budget.js"></script>
<script src="src/lib/budgetword.js"></script>
<script src="src/lib/windowstore.js"></script>
<script src="src/billwindow.js"></script>
</body>
</html>
